[package]
name = "sysdash"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
mime_guess = "2.0.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
tokio = { version = "1.54.0", features = ["rt", "macros", "net", "sync", "time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
